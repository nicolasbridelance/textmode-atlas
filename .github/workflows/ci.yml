#
# Every check is blocking. `just check` runs the same commands locally.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg16-bookworm
        env:
          POSTGRES_USER: tm
          POSTGRES_PASSWORD: tm
          POSTGRES_DB: tm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tm -d tm" --health-interval 2s --health-retries 30
    env:
      TM_DATABASE_URL: postgresql+psycopg://tm:tm@localhost:5432/tm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups --locked
      - name: Style and format
        run: just lint
      - name: Strict typing
        run: just typecheck
      - name: Migrations up, down and up again on a blank PostgreSQL
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - name: Tests, coverage, SQL constraints
        run: just test
      - name: Corpus YAML against JSON Schema
        run: just corpus
      - name: No artwork committed
        run: just no-artworks
      - name: Unused Python code and dependencies
        run: |
          uv run vulture
          for package in ingest renderers analysis api; do (cd $package && uv run deptry .); done

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit messages follow the rules
        run: |
          status=0
          for sha in $(git rev-list --no-merges origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > /tmp/msg
            python3 scripts/check_commit_msg.py /tmp/msg || { echo "  in $sha"; status=1; }
          done
          exit $status

  devcontainer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the development image and check its tools
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: tm-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm tm-dev:ci sh -c "ansilove -v && uv --version && just --version"

  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Paraglide messages and SvelteKit types
        run: pnpm --filter museum run prepare
      - name: Unused TypeScript code and dependencies, duplication
        run: |
          pnpm run hygiene:unused
          pnpm run hygiene:duplicates
      - working-directory: apps/museum
        run: |
          pnpm run lint
          pnpm run check
          pnpm test
      - working-directory: apps/museum
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end
        working-directory: apps/museum
        run: pnpm run test:e2e
