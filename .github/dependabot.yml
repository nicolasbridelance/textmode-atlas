#
# Updates are grouped so that one pull request (and one CI run) covers each ecosystem's routine
# bumps. Major versions come separately: they often need code changes.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      web-minor:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node version of the toolchain (24), not the latest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 (the native compiler) drops the JS API that svelte-kit sync, svelte-check,
      # ESLint and knip call (#11). Lift this once they support it.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule: { interval: monthly }
