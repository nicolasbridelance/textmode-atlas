#
# The practices of the character arts, held or not (ADR 0031). A practice is held when a
# representative is named: an artifact of the holdings, by SHA-256 and path at its source.
# Holding: file (digital original), capture (screen read from a running program, with its
# recipe), reproduction (scan or photograph of a physical object), record (description and
# link only). Sources name entries of docs/sources/README.md or candidates to check there.
version: 1

families:
  - code: scene
    label: { en: "Computer art scenes", fr: "Scènes de l'art informatique" }
  - code: home-computers
    label: { en: "Home computers and their character sets", fr: "Micro-ordinateurs et leurs jeux de caractères" }
  - code: networks
    label: { en: "Networks and messages", fr: "Réseaux et messages" }
  - code: broadcast
    label: { en: "Broadcast and videotex", fr: "Télédiffusion et vidéotex" }
  - code: machines
    label: { en: "Teleprinters, printers and typewriters", fr: "Téléscripteurs, imprimantes et machines à écrire" }
  - code: unicode
    label: { en: "Unicode and non-Latin scripts", fr: "Unicode et écritures non latines" }
  - code: moving
    label: { en: "Animation and demos in text", fr: "Animation et démos en texte" }
  - code: games
    label: { en: "Games of characters", fr: "Jeux de caractères" }
  - code: screens
    label: { en: "Screens of systems and programs", fr: "Écrans des systèmes et des programmes" }
  - code: documents
    label: { en: "Documents in text mode", fr: "Documents en mode texte" }
  - code: code
    label: { en: "Code as image", fr: "Le code comme image" }
  - code: type
    label: { en: "Character fonts", fr: "Polices de caractères" }
  - code: sound
    label: { en: "Characters and sound", fr: "Caractères et son" }
  - code: poetry
    label: { en: "Visual poetry and the written image", fr: "Poésie visuelle et image écrite" }
  - code: ancestors
    label: { en: "Ancestors of the grid", fr: "Ancêtres de la grille" }

