# SPDX-FileCopyrightText: 2026 textmode-atlas contributors
# SPDX-License-Identifier: CC0-1.0
#
# Single acquisitions (ADR 0031): one file chosen to represent a practice, its source, and the
# basis on which the museum holds it: `scene` (released by the scene, held by a scene archive,
# ADR 0009), `license` (a licence its author gave, named), `public-domain`. `tm acquire` fetches
# them one at a time. Every URL and licence here was checked at the source on 2026-10-10.
version: 1

sources:
  - name: scene.org
    url: https://files.scene.org/
    note: Demoscene file archive; mirroring encouraged; rights stay with the authors (docs/sources/scene-org.md).
  - name: textfiles
    url: http://www.textfiles.com/
    note: Jason Scott's textfiles.com; no terms stated, removal on request (docs/sources/textfiles.md).
  - name: wikimedia-commons
    url: https://commons.wikimedia.org/
    note: Free media repository; each file's licence or public-domain status is stated on its page.
  - name: unix-history-repo
    url: https://github.com/dspinellis/unix-history-repo
    note: Git history of Unix from 1970, by Diomidis Spinellis; each file keeps its original licence.
  - name: ioccc
    url: https://www.ioccc.org/
    note: International Obfuscated C Code Contest; winning entries under CC BY-SA 4.0 (ioccc.org/license.html).
  - name: int10h
    url: https://int10h.org/oldschool-pc-fonts/
    note: The Ultimate Oldschool PC Font Pack by VileR; CC BY-SA 4.0.
  - name: esolangs
    url: https://esolangs.org/
    note: Esolang wiki; all content under CC0 1.0.
  - name: cs.cmu.edu
    url: https://www.cs.cmu.edu/~sef/
    note: Scott E. Fahlman's pages at Carnegie Mellon University.
  - name: freebsd
    url: https://github.com/freebsd/freebsd-src
    note: FreeBSD source tree; BSD licence.
  - name: nethack
    url: https://github.com/NetHack/NetHack
    note: NetHack source tree; NetHack General Public License.
  - name: ja.wikipedia
    url: https://ja.wikipedia.org/
    note: Japanese Wikipedia; text under CC BY-SA 4.0, revisions pinned by oldid.

entries:
  # --- home computers, demoscene -------------------------------------------------------------
  - practice: petscii
    title: Fågel
    url: https://files.scene.org/get/parties/2013/datastorm13/c64/petscii/acidt-rrorreast-faagel.zip
    source: scene.org
    basis: scene
    why:
      en: "Winner of the C64 PETSCII compo at Datastorm 2013."
      fr: "Lauréate de la compétition PETSCII sur C64 à la Datastorm 2013."
  - practice: atascii
    title: Attack Of The Giant Bugs
    url: https://files.scene.org/get/parties/2021/atascii_compo21/atascii_compo/bugs.zip
    source: scene.org
    basis: scene
    why:
      en: "Winner of the ATASCII Compo 2021, a party held for the Atari 8-bit character set alone."
      fr: "Lauréate de l’ATASCII Compo 2021, une compétition consacrée au seul jeu de caractères des Atari 8 bits."
  - practice: textmode-demos
    title: Ringnes Motion
    url: https://files.scene.org/get/parties/1996/distortion96/demo/ringnesm.zip
    source: scene.org
    basis: scene
    why:
      en: "Winner of the demo compo at Distortion 1996: a PC demo drawn in character cells."
      fr: "Lauréate de la compétition de démos à la Distortion 1996 : une démo PC dessinée en cellules de caractères."

  # --- textfiles.com ---------------------------------------------------------------------------
  - practice: line-printer-art
    title: Ludwig Van Beethoven (DECUS printer art)
    url: http://www.textfiles.com/art/DECUS/beethoven.txt
    source: textfiles
    basis: scene
    format: ascii
    why:
      en: "From the DECUS poster collection, printer art of computer labs about 1985; some lines are struck twice for near-black cells."
      fr: "De la collection d’affiches DECUS, art d’imprimante des salles informatiques vers 1985 ; certaines lignes sont frappées deux fois pour des cellules presque noires."
  - practice: ansi-music
    title: Beethoven's 5th Symphony
    url: http://artscene.textfiles.com/ansimusic/songs/5th-symp.ams
    source: textfiles
    basis: scene
    format: ansi
    why:
      en: "ANSI music by Ed Bragg (3 April 1992): music played by the escape sequences of a BBS terminal."
      fr: "Musique ANSI d’Ed Bragg (3 avril 1992) : de la musique jouée par les séquences d’échappement d’un terminal de BBS."
  - practice: walkthroughs-faqs
    title: "Walkthrough: The Original Colossal Cave"
    url: http://www.textfiles.com/adventure/adventure.txt
    source: textfiles
    basis: scene
    format: ascii
    why:
      en: "A walkthrough of the first text adventure, Colossal Cave."
      fr: "La soluce de la première aventure textuelle, Colossal Cave."
  - practice: warez-documents
    title: You Hack 'Em, We Hump 'Em, or Why YOU should be a Software Courier
    url: http://www.textfiles.com/piracy/courier.txt
    source: textfiles
    basis: scene
    format: ascii
    why:
      en: "A courier's recruiting text by Dixie Flatline, from the warez scene."
      fr: "Un texte de recrutement de coursier par Dixie Flatline, issu de la scène warez."

  # --- documents and code ----------------------------------------------------------------------
  - practice: man-pages
    title: ls(1), 4.4BSD-Lite2
    url: https://raw.githubusercontent.com/dspinellis/unix-history-repo/BSD-4_4_Lite2/usr/src/bin/ls/ls.1
    source: unix-history-repo
    basis: license
    license: BSD-4-Clause-UC
    why:
      en: "The manual page of ls as Berkeley released it in 1995, in roff, read on a character terminal."
      fr: "La page de manuel de ls telle que Berkeley l’a publiée en 1995, en roff, lue sur un terminal en caractères."
  - practice: source-code-art
    title: westley.c (IOCCC 1988, best layout)
    url: https://www.ioccc.org/1988/westley/westley.c
    source: ioccc
    basis: license
    format: ascii
    license: CC-BY-SA-4.0
    why:
      en: "Brian Westley's 1988 winner for best layout: a program whose source is drawn as a circle."
      fr: "Le programme de Brian Westley, primé en 1988 pour sa mise en page : un code source dessiné en cercle."
  - practice: two-dimensional-languages
    title: Befunge (Esolang wiki page)
    url: https://esolangs.org/w/index.php?title=Befunge&action=raw
    source: esolangs
    basis: license
    license: CC0-1.0
    why:
      en: "Befunge-93 (Chris Pressey, 1993), a language whose program is a grid of characters walked by the instruction pointer; the page holds its examples."
      fr: "Befunge-93 (Chris Pressey, 1993), un langage dont le programme est une grille de caractères que parcourt le pointeur d’instruction ; la page en donne des exemples."
  - practice: rom-fonts
    title: The Ultimate Oldschool PC Font Pack v2.2
    url: https://int10h.org/oldschool-pc-fonts/download/oldschool_pc_font_pack_v2.2_FULL.zip
    source: int10h
    basis: license
    license: CC-BY-SA-4.0
    why:
      en: "Remakes of the character ROMs of IBM PCs and compatibles, from VileR's dumps of the original hardware."
      fr: "Les polices des ROM de caractères des PC IBM et compatibles, refaites par VileR d’après le matériel d’origine."

  # --- poetry and ancestors, reproductions ----------------------------------------------------
  - practice: calligrams
    title: Il pleut (Guillaume Apollinaire, Calligrammes)
    url: https://upload.wikimedia.org/wikipedia/commons/9/9b/Guillaume_Apollinaire_-_Calligramme_-_Il_pleut.png
    source: wikimedia-commons
    basis: public-domain
    why:
      en: "The calligram whose letters fall as rain (written 1916, published 1918)."
      fr: "Le calligramme dont les lettres tombent en pluie (écrit en 1916, publié en 1918)."
  - practice: concrete-poetry
    title: Un coup de dés jamais n'abolira le hasard (Stéphane Mallarmé, 1914 edition)
    url: https://upload.wikimedia.org/wikipedia/commons/1/18/Mallarm%C3%A9_-_Un_coup_de_d%C3%A9s%2C_1914.djvu
    source: wikimedia-commons
    basis: public-domain
    why:
      en: "The poem laid out on the double page as Mallarmé wished it, first published so in 1914: the founding text of spatial poetry."
      fr: "Le poème disposé sur la double page comme Mallarmé le voulait, publié ainsi pour la première fois en 1914 : le texte fondateur de la poésie spatiale."
  - practice: micrography
    title: The Five Scrolls in multilingual micrography (Aaron Wolf Herlingen, 1748)
    url: https://upload.wikimedia.org/wikipedia/commons/e/e0/Scribe_and_illuminator-_Aaron_Wolf_Herlingen_-_The_Five_Scrolls_in_multilingual_micrography_Ruth%2C_Song_of_Songs%2C_Ecclesiastes%2C_Esther%2C_and_Lamentat..._-_Google_Art_Project.jpg
    source: wikimedia-commons
    basis: public-domain
    why:
      en: "Pictures drawn with lines of minute script, by a Viennese scribe of 1748."
      fr: "Des images tracées en lignes d’écriture minuscule, par un scribe viennois de 1748."
  - practice: jacquard
    title: Portrait of Joseph Marie Jacquard, woven in silk (1839)
    url: https://upload.wikimedia.org/wikipedia/commons/e/e1/Jacquard_Joseph_Marie_woven_silk.jpg
    source: wikimedia-commons
    basis: public-domain
    why:
      en: "A portrait woven on a Jacquard loom from about 24,000 punched cards: an image made of discrete cells a century before the screen."
      fr: "Un portrait tissé sur un métier Jacquard à partir de quelque 24 000 cartes perforées : une image faite de cellules distinctes, un siècle avant l’écran."
  - practice: punched-cards
    title: 80-column punched card
    url: https://upload.wikimedia.org/wikipedia/commons/5/53/80-column_punched_card_edited_by_sub-assemblies_of_a_Pentaconta_electromechanical_telephone_exchange.jpg
    source: wikimedia-commons
    basis: license
    license: CC0-1.0
    why:
      en: "The 80-column card whose width became the terminal's 80 columns."
      fr: "La carte de 80 colonnes, dont la largeur est devenue celle du terminal."
  - practice: cross-stitch
    title: Sampler (England, 1774)
    url: https://upload.wikimedia.org/wikipedia/commons/c/cb/Sampler_%28England%29%2C_1774_%28CH_18727633%29.jpg
    source: wikimedia-commons
    basis: public-domain
    why:
      en: "Letters and motifs stitched on a grid of threads (Cooper Hewitt collection)."
      fr: "Lettres et motifs brodés sur une grille de fils (collection Cooper Hewitt)."

  # --- excerpts, cut by the museum where the art sits (ADR 0032) ------------------------------
  - practice: emoticons
    title: The first smiley (Scott E. Fahlman, 19 September 1982)
    url: http://www.cs.cmu.edu/~sef/Orig-Smiley.htm
    source: cs.cmu.edu
    basis: excerpt
    lines: 124-127
    html: true
    credit: Scott E. Fahlman
    format: ascii
    why:
      en: "The bboard message in which :-) and :-( were proposed, recovered from a 1982 backup tape in 2002 and kept by its author."
      fr: "Le message de bboard où :-) et :-( furent proposés, retrouvé en 2002 sur une bande de sauvegarde de 1982 et conservé par son auteur."
  - practice: os-screens
    title: Beastie, the FreeBSD boot loader's daemon (black and white)
    url: https://raw.githubusercontent.com/freebsd/freebsd-src/release/13.0.0/stand/forth/logo-beastiebw.4th
    source: freebsd
    basis: excerpt
    lines: 38-56
    pattern: 's"(.*)"\s+logo\+'
    credit: FreeBSD boot loader
    format: ascii
    why:
      en: "The mascot the boot loader drew in characters beside its menu, 19 rows by 34 columns, on every FreeBSD machine at start."
      fr: "La mascotte que le chargeur d’amorçage dessinait en caractères à côté de son menu, 19 lignes sur 34 colonnes, au démarrage de chaque machine FreeBSD."
  - practice: roguelikes
    title: The tombstone of NetHack 3.6
    url: https://raw.githubusercontent.com/NetHack/NetHack/NetHack-3.6.6_Released/src/rip.c
    source: nethack
    basis: excerpt
    lines: 24-38
    pattern: '"(.*)"'
    escapes: true
    credit: NetHack DevTeam
    format: ascii
    why:
      en: "The grave every NetHack game ends on, drawn in characters with the hero's name, gold and cause of death written on the stone."
      fr: "La tombe sur laquelle finit toute partie de NetHack, dessinée en caractères, avec le nom du héros, son or et la cause de sa mort gravés sur la pierre."
  - practice: shift-jis-art
    title: おまえらもひまな奴らだなぁ (2channel AA)
    url: https://ja.wikipedia.org/w/index.php?title=%E3%83%A2%E3%83%8A%E3%83%BC&oldid=110719286&action=raw
    source: ja.wikipedia
    basis: excerpt
    lines: 41-47
    html: true
    credit: unknown (2channel)
    format: unicode
    why:
      en: "A character of 2channel's AA with its speech balloon, drawn for the proportional MS PGothic font, as quoted in the Japanese article on Mona."
      fr: "Un personnage des AA de 2channel avec sa bulle, dessiné pour la police proportionnelle MS PGothic, tel que le cite l’article japonais sur Mona."
  - practice: text-user-interfaces
    title: Midnight Commander (screenshot)
    url: https://upload.wikimedia.org/wikipedia/commons/6/6b/Midnight_Commander_screenshot.png
    source: wikimedia-commons
    basis: license
    license: GPL
    why:
      en: "The two-panel file manager of the text terminal, its frames, menus and function keys all drawn in characters."
      fr: "Le gestionnaire de fichiers à deux panneaux du terminal texte, cadres, menus et touches de fonction tous dessinés en caractères."
  - practice: mosaic
    title: Justinian and his court (San Vitale, Ravenna, 547)
    url: https://upload.wikimedia.org/wikipedia/commons/7/74/Justinian_mosaic%2C_San_Vitale%2C_consecrated_547%2C_Ravenna%2C_Italy.jpg
    source: wikimedia-commons
    basis: license
    license: CC-BY-2.0
    why:
      en: "An image built of small square tesserae, each one colour: the grid of cells fifteen centuries before the screen."
      fr: "Une image faite de petites tesselles carrées, chacune d’une couleur : la grille de cellules quinze siècles avant l’écran."

  # --- more of the demoscene, found through Demozoo's tags and placings (lead I91) -------------
  - practice: amiga-ansi
    title: dharmachakra
    url: https://files.scene.org/get/parties/2015/evoke15/amiga_ansi_ascii/ldn-dharmachakra.zip
    source: scene.org
    basis: scene
    why:
      en: "Winner of the Amiga ANSI and ASCII compo at Evoke 2015, drawn for the Amiga's own fonts and palette."
      fr: "Lauréate de la compétition ANSI et ASCII Amiga à l’Evoke 2015, dessinée pour les polices et la palette de l’Amiga."
  - practice: bbc-mode7
    title: Teletextr
    url: https://files.scene.org/get/parties/2017/nova17/oldschool_demo/bitshifters-teletextr.zip
    source: scene.org
    basis: scene
    why:
      en: "Winner of the oldschool demo compo at Nova 2017: a BBC Micro demo drawn in Mode 7, the computer's teletext screen."
      fr: "Lauréate de la compétition de démos oldschool à la Nova 2017 : une démo pour BBC Micro dessinée en Mode 7, l’écran télétexte de la machine."
  - practice: cracktros
    title: Knights Of Legend cracktro (THG)
    url: https://files.scene.org/get/demos/compilations/lost_found_and_more/cracktro/knights_of_legend_cracktro.zip
    source: scene.org
    basis: scene
    why:
      en: "A text-mode cracktro of 1990, the intro alone (3,463 bytes), without the game it came with."
      fr: "Une cracktro en mode texte de 1990, l’intro seule (3 463 octets), sans le jeu qu’elle accompagnait."
  - practice: sizecoding
    title: Demozoo Ad
    url: https://files.scene.org/get/parties/2018/dihalt18lite/hiend_1k/sensenstahl-demozoo_ad.zip
    source: scene.org
    basis: scene
    why:
      en: "Winner of the 1 KB intro compo at DiHalt 2018 Lite: a text-mode intro in a thousand bytes."
      fr: "Lauréate de la compétition d’intros de 1 Ko à la DiHalt 2018 Lite : une intro en mode texte tenant en mille octets."
  - practice: text-mode-games
    title: Kitty Of Death
    url: https://files.scene.org/get/demos/compos/256_byte_game_compo/kitty_of_death.zip
    source: scene.org
    basis: scene
    why:
      en: "A game in 256 bytes, from the 1995 256 Byte Game Compo, played in text mode."
      fr: "Un jeu en 256 octets, de la 256 Byte Game Compo de 1995, joué en mode texte."
