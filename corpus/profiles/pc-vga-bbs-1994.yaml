title:
  en: PC VGA, 80×25 text mode, BBS at 2400 baud (around 1994)
  fr: PC VGA, mode texte 80×25, BBS en 2400 bauds (vers 1994)
system: ansi-cp437
grid: 80x25
cell: 9x16
font: { file: ibm-vga-8x16.f16, sha256: ff3640ffffdd774ec56ee7ecacf7bce8324a67071155ade07f4c6380fa879025 }
