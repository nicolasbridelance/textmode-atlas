#
# Dummy credentials of the local environment are public on purpose. Nothing else is allowed.
[extend]
useDefault = true

[allowlist]
description = "Local-only dummy credentials (compose, Garage, devcontainer)"
paths = [
  '''^\.env\.example$''',
  '''^infra/local/garage\.toml$''',
  '''^\.devcontainer/compose\.dev\.yaml$''',
  '''^ingest/src/tm/dev\.py$''',
]
